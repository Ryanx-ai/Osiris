<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#000000" stroke="none"/><text x="80" y="65" fill="#FFFFFF" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="650" letter-spacing="0">OSIRIS</text><text x="80" y="120" fill="#AEB8BF" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="500" letter-spacing="0">Interface foundations</text><rect x="80" y="930" width="1440" height="1" rx="0" fill="#30363B" stroke="none"/><text x="80" y="965" fill="#AEB8BF" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" letter-spacing="0">Brand &amp; product direction / 19 November 2026</text><text x="1435" y="965" fill="#AEB8BF" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" letter-spacing="0">06 / 10</text><text x="80" y="230" fill="#FFFFFF" font-family="Inter,Arial,sans-serif" font-size="58" font-weight="550" letter-spacing="-1.4500000000000002">Built for everyday work.</text><text x="80" y="300" fill="#AEB8BF" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="400" letter-spacing="0">8px rhythm. Clear labels. A visible next step.</text><rect x="80" y="390" width="230" height="64" rx="8" fill="#62DDEB" stroke="none"/><text x="115" y="432" fill="#000000" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="550" letter-spacing="0">Share proposal</text><rect x="335" y="390" width="230" height="64" rx="8" fill="#141719" stroke="#30363B"/><text x="380" y="432" fill="#FFFFFF" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="400" letter-spacing="0">Preview</text><rect x="80" y="495" width="485" height="100" rx="8" fill="#141719" stroke="#30363B"/><text x="105" y="528" fill="#AEB8BF" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">Company name</text><text x="105" y="568" fill="#FFFFFF" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="400" letter-spacing="0">Example Engineering</text><rect x="80" y="635" width="485" height="88" rx="8" fill="#10282D" stroke="#62DDEB"/><text x="105" y="687" fill="#62DDEB" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="550" letter-spacing="0">Project files</text><text x="790" y="420" fill="#FFFFFF" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="550" letter-spacing="0">Interaction rules</text><text x="790" y="475" fill="#AEB8BF" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="400" letter-spacing="0">40px desktop targets; 44px for touch.</text><text x="790" y="523" fill="#AEB8BF" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="400" letter-spacing="0">2px visible focus ring with breathing room.</text><text x="790" y="571" fill="#AEB8BF" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="400" letter-spacing="0">Hover and focus reveal the same information.</text><text x="790" y="619" fill="#AEB8BF" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="400" letter-spacing="0">Move up/down is always available beside drag.</text><text x="790" y="667" fill="#AEB8BF" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="400" letter-spacing="0">Save, offline and conflict states have text labels.</text><text x="790" y="800" fill="#AEB8BF" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="400" letter-spacing="0">Spacing</text><text x="790" y="850" fill="#62DDEB" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="400" letter-spacing="0">4   8   12   16   24   32   48   64</text></svg>