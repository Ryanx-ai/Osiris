<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#000000" stroke="none"/><text x="80" y="65" fill="#FFFFFF" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="650" letter-spacing="0">OSIRIS</text><text x="80" y="120" fill="#AEB8BF" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="500" letter-spacing="0">Voice and trust</text><rect x="80" y="930" width="1440" height="1" rx="0" fill="#30363B" stroke="none"/><text x="80" y="965" fill="#AEB8BF" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" letter-spacing="0">Brand &amp; product direction / 19 November 2026</text><text x="1435" y="965" fill="#AEB8BF" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" letter-spacing="0">09 / 10</text><text x="80" y="230" fill="#FFFFFF" font-family="Inter,Arial,sans-serif" font-size="55" font-weight="550" letter-spacing="-1.375">Say what happened. Show what comes next.</text><text x="80" y="305.0" fill="#AEB8BF" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="400" letter-spacing="0">Write like a capable colleague: direct, calm and specific.</text><text x="80" y="338.12" fill="#AEB8BF" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="400" letter-spacing="0">Name the action; make errors recoverable; label uncertainty honestly.</text><rect x="80" y="410" width="1440" height="1" rx="0" fill="#30363B" stroke="none"/><text x="80" y="460" fill="#62DDEB" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="550" letter-spacing="0">PUBLISH</text><text x="420" y="460" fill="#AEB8BF" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="400" letter-spacing="0">Something went wrong.</text><text x="900" y="460" fill="#FFFFFF" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="550" letter-spacing="0">Connection interrupted. Try again.</text><text x="900" y="500" fill="#AEB8BF" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" letter-spacing="0">Your draft is still here.</text><rect x="80" y="555" width="1440" height="1" rx="0" fill="#30363B" stroke="none"/><text x="80" y="605" fill="#62DDEB" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="550" letter-spacing="0">SAVE</text><text x="420" y="605" fill="#AEB8BF" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="400" letter-spacing="0">All good!</text><text x="900" y="605" fill="#FFFFFF" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="550" letter-spacing="0">Saved just now.</text><text x="900" y="645" fill="#AEB8BF" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" letter-spacing="0">Only show this after server confirmation.</text><rect x="80" y="700" width="1440" height="1" rx="0" fill="#30363B" stroke="none"/><text x="80" y="750" fill="#62DDEB" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="550" letter-spacing="0">ANALYTICS</text><text x="420" y="750" fill="#AEB8BF" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="400" letter-spacing="0">Jamie read everything.</text><text x="900" y="750" fill="#FFFFFF" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="550" letter-spacing="0">Anonymous visit · 6 slides viewed</text><text x="900" y="790" fill="#AEB8BF" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" letter-spacing="0">Identity and intent are not inferred.</text></svg>