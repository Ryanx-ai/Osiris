<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#FFFFFF" stroke="none"/><text x="80" y="65" fill="#000000" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="650" letter-spacing="0">OSIRIS</text><text x="80" y="120" fill="#52616B" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="500" letter-spacing="0">Typography</text><rect x="80" y="930" width="1440" height="1" rx="0" fill="#D3DBDF" stroke="none"/><text x="80" y="965" fill="#52616B" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" letter-spacing="0">Brand &amp; product direction / 19 November 2026</text><text x="1435" y="965" fill="#52616B" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" letter-spacing="0">05 / 10</text><text x="80" y="230" fill="#000000" font-family="Inter,Arial,sans-serif" font-size="64" font-weight="550" letter-spacing="-1.6">Direct. Legible. Uncomplicated.</text><text x="80" y="340" fill="#000000" font-family="Inter,Arial,sans-serif" font-size="100" font-weight="550" letter-spacing="-2.5">Inter</text><text x="80" y="420.0" fill="#52616B" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="400" letter-spacing="0">A single type family keeps the workspace coherent.</text><text x="80" y="450.36" fill="#52616B" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="400" letter-spacing="0">Use Arial or the system sans-serif as a fallback.</text><text x="80" y="540" fill="#000000" font-family="Inter,Arial,sans-serif" font-size="44" font-weight="400" letter-spacing="-1.1">Aa Bb Cc Dd Ee Ff Gg</text><text x="80" y="608" fill="#000000" font-family="Inter,Arial,sans-serif" font-size="40" font-weight="400" letter-spacing="-1.0">0123456789  /  @  +  %</text><text x="80" y="790" fill="#52616B" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="400" letter-spacing="0">Sentence case for actions. Numbers aligned in tables.</text><text x="930" y="250" fill="#52616B" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="500" letter-spacing="0">PAGE TITLE / 32</text><text x="930" y="300" fill="#000000" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="550" letter-spacing="0">Project files</text><text x="930" y="380" fill="#52616B" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="500" letter-spacing="0">SECTION / 24</text><text x="930" y="430" fill="#000000" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="550" letter-spacing="0">Client details</text><text x="930" y="510" fill="#52616B" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="500" letter-spacing="0">BODY / 16</text><text x="930" y="560" fill="#000000" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="550" letter-spacing="0">Preview before you share.</text><text x="930" y="640" fill="#52616B" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="500" letter-spacing="0">CONTROL / 14</text><text x="930" y="690" fill="#000000" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="400" letter-spacing="0">Create share link</text><text x="930" y="770" fill="#52616B" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="500" letter-spacing="0">SUPPORT / 12</text><text x="930" y="820" fill="#000000" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="400" letter-spacing="0">Your draft is saved.</text></svg>