<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#000000" stroke="none"/><text x="80" y="65" fill="#FFFFFF" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="650" letter-spacing="0">OSIRIS</text><text x="80" y="120" fill="#AEB8BF" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="500" letter-spacing="0">Logo stewardship</text><rect x="80" y="930" width="1440" height="1" rx="0" fill="#30363B" stroke="none"/><text x="80" y="965" fill="#AEB8BF" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" letter-spacing="0">Brand &amp; product direction / 19 November 2026</text><text x="1435" y="965" fill="#AEB8BF" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" letter-spacing="0">03 / 10</text><text x="80" y="230" fill="#FFFFFF" font-family="Inter,Arial,sans-serif" font-size="56" font-weight="550" letter-spacing="-1.4000000000000001">One identity. A dependable signature.</text><text x="80" y="295.0" fill="#AEB8BF" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="400" letter-spacing="0">The existing Figma logo is the master. This page documents the current app mark</text><text x="80" y="325.36" fill="#AEB8BF" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="400" letter-spacing="0">as a reference only; do not replace or redraw the approved logo from this book.</text><rect x="80" y="380" width="610" height="400" rx="12" fill="#141719" stroke="none"/><g transform="translate(270,450) scale(3.75)"><rect width="64" height="64" rx="14" fill="#050505"/><circle cx="32" cy="32" r="18" fill="none" stroke="white" stroke-width="8"/><path d="M32 14a18 18 0 0 1 18 18" fill="none" stroke="#22d3ee" stroke-width="8" stroke-linecap="round"/></g><text x="115" y="742" fill="#AEB8BF" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="400" letter-spacing="0">Current application mark</text><text x="810" y="435" fill="#FFFFFF" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="550" letter-spacing="0">Use</text><text x="810" y="485" fill="#AEB8BF" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="400" letter-spacing="0">Place the approved mark on a quiet surface.</text><text x="810" y="527" fill="#AEB8BF" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="400" letter-spacing="0">Keep a clear buffer around the full lockup.</text><text x="810" y="569" fill="#AEB8BF" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="400" letter-spacing="0">Use a compact mark for browser and app icons.</text><text x="810" y="680" fill="#FFFFFF" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="550" letter-spacing="0">Avoid</text><text x="810" y="730" fill="#AEB8BF" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="400" letter-spacing="0">No stretching, glow or decorative gradients.</text><text x="810" y="766" fill="#AEB8BF" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="400" letter-spacing="0">No recolouring the client’s own brand.</text><text x="810" y="802" fill="#AEB8BF" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="400" letter-spacing="0">Final clear-space and minimum-size values await</text><text x="810" y="838" fill="#AEB8BF" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="400" letter-spacing="0">inspection of the supplied logo master.</text></svg>