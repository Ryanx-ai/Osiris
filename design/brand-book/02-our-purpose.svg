<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#FFFFFF" stroke="none"/><text x="80" y="65" fill="#000000" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="650" letter-spacing="0">OSIRIS</text><text x="80" y="120" fill="#52616B" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="500" letter-spacing="0">Our purpose</text><rect x="80" y="930" width="1440" height="1" rx="0" fill="#D3DBDF" stroke="none"/><text x="80" y="965" fill="#52616B" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" letter-spacing="0">Brand &amp; product direction / 19 November 2026</text><text x="1435" y="965" fill="#52616B" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" letter-spacing="0">02 / 10</text><text x="80" y="245" fill="#000000" font-family="Inter,Arial,sans-serif" font-size="76" font-weight="550" letter-spacing="-1.9000000000000001">From the first brief</text><text x="80" y="333" fill="#000000" font-family="Inter,Arial,sans-serif" font-size="76" font-weight="550" letter-spacing="-1.9000000000000001">to a confident share.</text><text x="80" y="485" fill="#52616B" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="400" letter-spacing="0">OSIRIS helps sales teams create consistent,</text><text x="80" y="527" fill="#52616B" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="400" letter-spacing="0">client-specific presentations and proposals,</text><text x="80" y="569" fill="#52616B" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="400" letter-spacing="0">preview the real experience, and send one link.</text><text x="80" y="830" fill="#52616B" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="400" letter-spacing="0">For Ryan, Izzat and the sales teams that follow.</text><text x="940" y="240" fill="#057686" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="550" letter-spacing="0">01</text><text x="940" y="290" fill="#000000" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="550" letter-spacing="0">Clarity first</text><text x="940" y="337.0" fill="#52616B" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="400" letter-spacing="0">Keep the next action visible.</text><text x="940" y="367.36" fill="#52616B" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="400" letter-spacing="0">Hide complexity until it is relevant.</text><text x="940" y="445" fill="#057686" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="550" letter-spacing="0">02</text><text x="940" y="495" fill="#000000" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="550" letter-spacing="0">Confidence built in</text><text x="940" y="542.0" fill="#52616B" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="400" letter-spacing="0">Show what is saved and what is shared.</text><text x="940" y="572.36" fill="#52616B" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="400" letter-spacing="0">Never imply success without evidence.</text><text x="940" y="650" fill="#057686" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="550" letter-spacing="0">03</text><text x="940" y="700" fill="#000000" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="550" letter-spacing="0">Make it yours</text><text x="940" y="747.0" fill="#52616B" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="400" letter-spacing="0">Brand once, adapt per client.</text><text x="940" y="777.36" fill="#52616B" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="400" letter-spacing="0">Keep the recipient experience consistent.</text></svg>